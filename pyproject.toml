[project]
name = "ssios"
version = "0.1.0"
description = "Local-first personal Agent OS prototype: policy plane, Letta MemFS-compatible memory, approvals, and a fail-closed microVM adapter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kent Liu" }]
dependencies = ["keyring>=25"]

[project.scripts]
ssios = "ssios.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
