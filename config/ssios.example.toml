# SSIOS 开发配置样例。不含凭证。真实令牌由 `ssios init` 写到状态目录。
# 默认只绑定环回地址。不要把 host 改成 0.0.0.0。

profile = "dev"

[server]
host = "127.0.0.1"
port = 8765

[llm]
# mock：确定性、无网络。ollama：本机 Ollama，无云端回退。
provider = "mock"
ollama_base_url = "http://127.0.0.1:11434"
ollama_model = "llama3.1:8b"
request_timeout_seconds = 60
# 答案 token 上限。思考模型会先请求 think=false，避免推理吃光这份预算。
max_output_tokens = 1024
# 上下文长度。7B 摘要建议 8192。笔记正文还会按 max_note_chars 截断后再送给模型。
num_ctx = 8192
max_note_chars = 6000
# 模型输出不是合法 JSON 时，最多再试一次。0 表示不重试。
summary_repair_retries = 1

[runtime]
# dev-guard 是进程内限制，不是 microVM。
# macos-vm 使用 krunvm。cloud-hypervisor 在具备内核和 initramfs 时启动客户机，否则失败关闭。
backend = "dev-guard"
cpus = 1
memory_mb = 512
kvm_path = "/dev/kvm"
cloud_hypervisor_bin = "cloud-hypervisor"
virtiofsd_bin = "virtiofsd"
kernel_path = ""
root_image_path = ""
initramfs_path = ""
echo_initramfs_path = ""
krunvm_bin = "krunvm"
# krunvm 0.2.7 把挂载点存在自己的配置里。它提示的默认值是 /Volumes/krunvm，没有对应的环境变量。
macos_vm_volume = "/Volumes/krunvm"
# summary 是现在的客户机摘要 worker。codex 把钉住的 Codex CLI 放进客户机，模型仍由宿主机模拟。
agent = "summary"
# 第一次 krunvm create 会拉取镜像，不占用任务超时。
guest_prepare_timeout_seconds = 600
# python:3.12-alpine 的清单摘要，2026-11-09 从 registry-1.docker.io 读取。
guest_image = "docker.io/library/python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7"

[agent.codex]
# 提供方名字在客户机配置里固定为 ssios，不是 ollama。这里只是模型名。
model = "qwen2.5-coder:7b"
allow_models = ["qwen2.5-coder:7b", "qwen2.5-coder:1.5b", "qwen2.5:0.5b"]
max_requests = 4
max_request_bytes = 200000

[limits]
task_timeout_seconds = 30
max_tool_calls = 8
max_output_bytes = 65536
approval_ttl_seconds = 600
core_token_budget = 2000

[memory]
# letta-memfs-compat：无 Letta CLI 时的兼容库，不是上游 MemFS。
# letta-memfs-upstream：钉住的 letta 0.34.45 本地后端。缺失时失败，不回退。
mode = "letta-memfs-compat"
letta_bin = ""
