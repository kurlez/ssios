# SSIOS development config sample. No credentials. `ssios init` writes real tokens into the state directory.
# Bind to loopback by default. Do not change host to 0.0.0.0.

profile = "dev"

[server]
host = "127.0.0.1"
port = 8765

[ui]
# 127.0.0.1 is the default. Set bind to "0.0.0.0" or start `ssios ui --lan` to serve the home network over HTTPS.
bind = "127.0.0.1"
# IANA zone for calendar dates. Empty uses this computer's local zone.
# Example: time_zone = "America/Los_Angeles"
time_zone = ""

[llm]
# mock: deterministic, no network. ollama: local Ollama, no cloud fallback.
provider = "mock"
ollama_base_url = "http://127.0.0.1:11434"
ollama_model = "llama3.1:8b"
# An attached image is read by this local model. Text chat and the guest stay on their own models.
# qwen3:14b remains the guest text model. Pull the vision weights by hand: ollama pull qwen2.5vl:7b
vision_model = "qwen2.5vl:7b"
# Small local classifier for turns the rules do not decide. It does not answer and it does not call tools.
# ollama pull qwen3:1.7b
# ollama pull qwen3:4b
router_model = "qwen3:1.7b"
router_timeout_seconds = 4
request_timeout_seconds = 60
# A mail report scales this by the target length and the number of batches. 20 seconds is too short for an 8B model.
report_base_seconds = 45
report_batch_seconds = 20
report_per_100_seconds = 8
# Answer token cap. Thinking models are asked for think=false first so reasoning does not consume this budget.
max_output_tokens = 1024
# Context length. 8192 is the suggestion for a 7B summary. Note bodies are also truncated to max_note_chars before they reach the model.
num_ctx = 8192
max_note_chars = 6000
# If the model output is not valid JSON, try once more. 0 means do not retry.
summary_repair_retries = 1

[runtime]
# dev-guard is an in-process limit, not a microVM.
# macos-vm uses krunvm. cloud-hypervisor boots a guest when the kernel and initramfs are present, otherwise it fails closed.
backend = "dev-guard"
cpus = 1
memory_mb = 512
kvm_path = "/dev/kvm"
cloud_hypervisor_bin = "cloud-hypervisor"
virtiofsd_bin = "virtiofsd"
kernel_path = ""
root_image_path = ""
initramfs_path = ""
echo_initramfs_path = ""
krunvm_bin = "krunvm"
# krunvm 0.2.7 stores the mount point in its own config. The default it prints is /Volumes/krunvm, and there is no matching environment variable.
macos_vm_volume = "/Volumes/krunvm"
# summary is the current guest summary worker. codex puts the pinned Codex CLI in the guest. The model is still served from the host.
agent = "summary"
# The first krunvm create pulls the image and does not consume the task timeout.
guest_prepare_timeout_seconds = 600
# Manifest digest of python:3.12-alpine, read from registry-1.docker.io on 2026-11-09.
guest_image = "docker.io/library/python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7"

[agent.codex]
# The provider name inside the guest config is fixed as ssios, not ollama. This field is only the model name.
# qwen3:14b is the guest default. qwen2.5-coder:7b and qwen3-coder:30b are smaller and larger alternatives.
# To try Meta Muse Glimmer on Apple Silicon: ollama pull muse-glimmer:30b-mlx (Ollama >= 0.32.8, MLX, about 19GB, Apache 2.0).
# On a 24GB Mac set model = "muse-glimmer:30b-mlx" and num_ctx = 16384. The model can use 128K, but that plus the 2GB guest leaves little free RAM.
# No Muse Glimmer timing is recorded here. Run ./scripts/ssios model-bench --model muse-glimmer:30b-mlx on the Mac before treating it as the default.
model = "qwen3:14b"
allow_models = ["qwen3:14b", "qwen2.5-coder:7b", "qwen3-coder:30b", "muse-glimmer:30b-mlx", "qwen2.5:7b", "llama3.1:8b"]
max_requests = 4
max_request_bytes = 200000
# Codex's system prompt plus tools is about 4098 tokens. Ollama's /v1/responses ignores request options and keeps the 4096 default.
# The proxy uses native /api/chat and sends options.num_ctx. Installed models are not modified. A 7B model on a 24GB M4 uses 16384, with a maximum of 32768.
num_ctx = 16384
# One plan, then at most this many tool calls. The turn stops at the timeout.
step_limit = 6
turn_timeout_seconds = 180

[agent.planner]
# When the Codex guest cannot start, a turn that needs several tools can run a tool loop on this computer instead.
# The local chat model picks from the same host tools the guest uses. Reads run now. A write is still an approval card.
# Off by default. The chat model must support Ollama tool calls. If it does not, the turn uses the single-route path.
enabled = false

[limits]
task_timeout_seconds = 30
max_tool_calls = 8
max_output_bytes = 65536
approval_ttl_seconds = 600
core_token_budget = 2000

[connectors]
# Read-only Google connectors. Empty means every fetch is denied.
# enabled = ["drive", "gmail", "calendar"]
enabled = []
max_calls = 40
max_bytes = 200000

[skills]
# Public web reads run on this computer. The guest stays offline. Off until an admin turns skills on.
enabled = false
allow_domains = []
deny_domains = []
timeout_seconds = 8
max_bytes = 200000
# Empty uses <state>/vaults/<account>. Do not point this at .ssios, .ssios-demo, or .ssios-memfs.
vault_dir = ""

[search]
# Search by meaning in Memory and Files. Empty keeps keyword search only. No model is pinned.
# Compare candidates on this computer first: ./scripts/ssios library-embed-bench
# bge-m3 handles Chinese and English. nomic-embed-text is smaller and mostly English. Pull by hand: ollama pull bge-m3
embed_model = ""
# At most this many results come from meaning. A lower score admits looser matches.
semantic_top_k = 8
semantic_min_score = 0.5

[memory]
# letta-memfs-compat: the compatibility library used when the Letta CLI is absent. It is not upstream MemFS.
# letta-memfs-upstream: the pinned letta 0.34.45 local backend. If it is missing, fail. Do not fall back.
mode = "letta-memfs-compat"
letta_bin = ""
